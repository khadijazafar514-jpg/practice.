<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css"
</head>
<body>
    <a href="index.html">homepage</a>
    <h1 style="color:black">Course Feedback</h1>   
    <form action="thanks.html" method="get" class="feedback-form">
    <label>Full name: </label>
    <input type="name" name="full name" required
    <br><br>
    <label>email: </label>
    <input type="email" name="email"
    <br><br>
    
    
    <label>Course name: </label>
    
    <select name="course"
    <option>html</option>
    <option>css</option>
    <option>html</option>
    <option>java script</option>
    <option>c++</option>
    </select>

    <label>Rate your experience: </label>
    <input type="radio" name="Rate your experience" value="excellent"
    <label>excellent</label>
    <input type="radio" name="Rate your experience" value="good"
    <label>good</label>
    <input type="radio" name="Rate your experience" value="poor"
    <label>poor</label>
    <br><br>


    <label>what you like: </label>
    <input type="checkbox" name="what you like" value="teaching"
    <label>teaching</label>
    <input type="checkbox" name="what you like" value="content"
    <label>content</label>
    <br><br>


    <label>preffered date</label>
    <input type="date" name="date"
    <br><br><br>

    <label>assignment: </label>
    <input type="file" name="assignment"
    <br><br><br>

    <label>comment: </label>
    <textarea name="feedback" rows="4" columns="30"></textarea>
    <br><br>
    <input type="submit" value="Send Feedback">
    


    

    </form>

</body>
</html>
